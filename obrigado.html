    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e3e8f0 0%, #f0f3f7 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        .card {
            text-align: center;
            padding: 60px 80px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            max-width: 700px;
            margin: 20px;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.2em;
            font-weight: 600;
            margin-bottom: 30px;
            line-height: 1.4;
            letter-spacing: -0.5px;
        }

        .blessing {
            color: #6c757d;
            font-size: 1.3em;
            margin-bottom: 40px;
            font-style: italic;
            font-weight: 400;
        }

        .heart-container {
            animation: pulse 2s ease-in-out infinite;
            display: inline-block;
            width: 60px;
            height: 60px;
        }

        .heart-svg {
            width: 100%;
            height: 100%;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
            100% {
                transform: scale(1);
            }
        }

        @media (max-width: 600px) {
            .card {
                padding: 40px 30px;
            }

            h1 {
                font-size: 1.8em;
            }

            .blessing {
                font-size: 1.1em;
            }

            .heart-container {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Gracias desde el fondo<br>de nuestros corazones</h1>
        <p class="blessing">Que Dios te bendiga a ti y a tu familia</p>
        <div class="heart-container">
            <svg class="heart-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M50,25 C40,10 20,10 20,30 C20,50 50,80 50,80 C50,80 80,50 80,30 C80,10 60,10 50,25 Z"
                      fill="#e74c3c"/>
            </svg>
        </div>
    </div>
</body>
</html>
